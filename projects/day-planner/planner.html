<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Day — planner</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="The Day" />
<meta name="theme-color" content="#f3efe9" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* tokens mirror projects/aios-dashboard/design-system/tokens.css */
  :root{
    --bg:#f3efe9;--card:#faf8f4;--ink:#1b1916;--accent:#3a352d;--muted:#7c756a;--line:#e0d9cd;--love:#b54b5a;
    --fn-focus:#3a352d;--fn-move:#7e8a6b;--fn-water:#7e95a3;--fn-social:#b54b5a;--fn-home:#7c756a;--fn-none:#a99f8f;
    --serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--r:6px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}  /* beats the explicit display rules on .week/.sheet/.month/.fab */
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;height:100vh;overflow:hidden}

  /* rail / inbox (now the right column) */
  .rail{background:var(--card);border-left:1px solid var(--line);padding:26px 20px;overflow-y:auto}
  .rail-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 14px;border-bottom:1px solid var(--line)}
  .inbox-lab{display:flex;align-items:center;gap:9px;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
  .inbox-lab svg{width:15px;height:15px;color:var(--muted)}
  .rail-add{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--muted);display:grid;place-items:center}
  .rail-add svg{width:15px;height:15px}
  .rail-add:hover{color:var(--ink);border-color:var(--muted)}
  .rail-list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .task{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;
    display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;transition:opacity .2s ease}
  .task.sched{opacity:.4}
  .task .chip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:currentColor;color:var(--fn-none)}
  .task .chip svg{width:15px;height:15px;color:#fff}
  .task .dur{font-size:9px;color:var(--muted);font-weight:400;letter-spacing:.2em;text-transform:uppercase}
  .task .ttl{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.1;margin-top:2px}
  .task .acts{display:flex;align-items:center;gap:2px}
  .task .add{width:26px;height:26px;border:0;background:transparent;cursor:pointer;color:var(--ink);display:grid;place-items:center;border-radius:50%}
  .task .add svg{width:17px;height:17px}
  .task .add:hover{background:var(--line)}
  .task .del{width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:50%}
  .task .del svg{width:14px;height:14px}
  .task .del:hover{background:var(--line);color:var(--love)}

  /* mail / pressing emails (left column) — same language as the inbox + timeline */
  .mail{background:var(--card);border-right:1px solid var(--line);padding:26px 20px;overflow-y:auto}
  .mail-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 14px;border-bottom:1px solid var(--line)}
  .mail-lab{display:flex;align-items:center;gap:9px;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
  .mail-lab svg{width:15px;height:15px;color:var(--muted)}
  .mail-count{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:0;color:var(--love);text-transform:none}
  .mail-note{font-size:10.5px;line-height:1.5;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-top:16px}
  .mail-note b{color:var(--ink);font-weight:500}
  .mlist{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .mcard{display:block;text-decoration:none;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;transition:border-color .15s,box-shadow .15s}
  .mcard:hover{border-color:var(--muted);box-shadow:0 4px 14px rgba(27,25,22,.06)}
  .mc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .mc-chip{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent);color:#fff}
  .mcard.unread .mc-chip{background:var(--love)}
  .mc-chip svg{width:15px;height:15px}
  .mc-from{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mc-date{font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;flex:none}
  .mc-subj{font-size:12.5px;font-weight:400;color:var(--ink);line-height:1.35;margin-bottom:4px}
  .mcard.unread .mc-subj{font-weight:500}
  .mc-snip{font-size:11.5px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mc-badges{display:flex;align-items:center;gap:11px;margin-top:9px}
  .mc-badge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .mc-badge.unread{color:var(--love)}
  .mc-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--love);display:block}
  .mc-badge.star svg{width:12px;height:12px}
  .mc-badge.star{color:#a9883f}
  .mail-empty{text-align:center;padding:42px 14px;color:var(--muted)}
  .mail-empty .big{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);margin-bottom:6px}
  .mail-empty>div:not(.big){font-size:12px;line-height:1.5}
  /* reply composer */
  .mc-open{display:block;text-decoration:none;color:inherit}
  .mc-actions{display:flex;gap:8px;margin-top:10px}
  .mc-reply{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#faf8f4;border:0;border-radius:var(--r);padding:6px 12px;font-family:var(--sans);font-weight:400;font-size:9px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  .mc-reply:hover{background:var(--accent)}
  .mc-reply svg{width:13px;height:13px}
  .mc-compose{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .mc-text{width:100%;min-height:120px;resize:vertical;font-family:var(--sans);font-weight:300;font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px}
  .mc-text:focus{outline:none;border-color:var(--muted)}
  .mc-cbtns{display:flex;align-items:center;gap:8px;margin-top:8px}
  .mc-gen{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;font-family:var(--sans);font-weight:400;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  .mc-gen:hover{color:var(--ink);border-color:var(--muted)}
  .mc-gen .spk{color:var(--love)}
  .mc-gen svg{width:13px;height:13px}
  .mc-cbtns .spacer{flex:1}
  .mc-cancel{background:transparent;border:0;color:var(--muted);font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .mc-cancel:hover{color:var(--ink)}
  .mc-send{background:var(--ink);color:#faf8f4;border:1px solid var(--ink);border-radius:var(--r);padding:7px 14px;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
  .mc-send:hover{background:var(--accent);border-color:var(--accent)}
  .mc-send:disabled{opacity:.5;cursor:not-allowed}
  .mc-hint{font-size:10.5px;line-height:1.5;color:var(--muted);margin-top:7px}
  .mc-hint b{color:var(--ink);font-weight:500}
  .mc-busy{font-size:11px;color:var(--muted);font-style:italic;padding:6px 2px}

  /* day pane */
  .day{position:relative;padding:24px 30px 0;overflow:hidden;display:flex;flex-direction:column}
  .day-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}
  .head-center{grid-column:2;text-align:center}
  .kicker{font-size:10px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .date-title{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.01em;white-space:nowrap;line-height:1}
  .date-title .yr{color:var(--muted)}
  .date-title .chev{color:var(--muted)}
  .head-tools{grid-column:3;justify-self:end;display:flex;gap:9px;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
    padding:8px 13px;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  .pill:hover{color:var(--ink);border-color:var(--muted)}
  .pill svg{width:14px;height:14px}
  .ai .spk{color:var(--love)}
  .icobtn{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
  .icobtn svg{width:15px;height:15px}
  .icobtn:hover{color:var(--ink);border-color:var(--muted)}
  .synced{font-size:9px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-right:2px}

  /* header nav (prev / today / next) + view toggle */
  .head-nav{grid-column:1;justify-self:start;display:flex;gap:7px;align-items:center}
  .navbtn{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);cursor:pointer;color:var(--muted);font-family:var(--serif);font-size:22px;line-height:0;display:grid;place-items:center;padding-bottom:3px}
  .navbtn:hover{color:var(--ink);border-color:var(--muted)}
  .today-btn{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  .today-btn:hover{color:var(--ink);border-color:var(--muted)}
  .viewtog{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .viewtog button{border:0;background:transparent;padding:8px 13px;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  .viewtog button+button{border-left:1px solid var(--line)}
  .viewtog button.on{background:var(--accent);color:#fff}

  /* month view */
  .month{flex:1;display:flex;flex-direction:column;overflow:hidden;margin-top:14px}
  .month-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 2px 9px;border-bottom:1px solid var(--line)}
  .month-dow span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;flex:1;padding-top:8px;padding-bottom:8px;overflow:hidden;min-height:0}
  .mcell{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 8px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;min-height:0}
  .mcell:hover{border-color:var(--muted)}
  .mcell.out{background:transparent;cursor:default}   /* keep the border so spill-over days stay contained */
  .mcell.out:hover{border-color:var(--line)}
  .mcell.out .mnum{color:var(--line)}
  .mcell.out .mev{opacity:.5}
  .mcell .mnum{font-family:var(--serif);font-size:16px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--ink);flex:none}
  .mcell.today .mnum{background:var(--love);color:#fff}
  .mev{font-family:var(--sans);font-size:10.5px;color:var(--ink);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;line-height:1.45}
  .mev i{width:6px;height:6px;border-radius:50%;flex:none}
  .mev span{overflow:hidden;text-overflow:ellipsis}
  .mcell .more{font-size:9.5px;color:var(--muted);letter-spacing:.04em;margin-top:1px}

  /* week strip */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:2px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;cursor:pointer}
  .wd .lab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .wd .num{font-family:var(--serif);font-size:21px;font-weight:500;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
  .wd.today .num{color:var(--love)}
  .wd.sel .num{background:var(--accent);color:#fff}
  .wd .dots{display:flex;gap:3px;height:6px;align-items:center}
  .wd .dots i{width:5px;height:5px;border-radius:50%;display:block}

  /* sheet */
  .sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;
    padding:14px 0 0;margin-top:14px;flex:1;overflow:hidden;display:flex;flex-direction:column}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}

  /* timeline */
  .timeline{position:relative;padding:20px 28px 80px;overflow-y:auto;flex:1}
  .gap{flex:none}  /* proportional free-time spacer between events */
  .allday{display:flex;gap:9px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 13px;margin-bottom:16px;font-family:var(--serif);font-size:16px;color:var(--ink)}
  .allday .tag{font-family:var(--sans);font-size:9px;font-weight:400;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .row{display:grid;grid-template-columns:56px 44px 1fr 34px;gap:12px;align-items:start;position:relative;z-index:1;padding:5px 0}
  .time{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.06em;text-align:right;padding-top:12px;line-height:1.6}
  .time small{display:block;font-size:10px;color:var(--line)}
  .node{width:44px;height:var(--nh,44px);min-height:44px;border-radius:22px;display:grid;justify-items:center;align-items:start;padding-top:12px;background:var(--c)}
  /* solid for ≤1hr circles; ombré (within the color family) only for longer pills */
  .row.long .node{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 68%,#fff))}
  .node svg{width:20px;height:20px;color:#fff}
  .body{padding-top:3px;cursor:pointer}
  .meta{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .ttl2{font-family:var(--serif);font-size:20px;font-weight:500;margin-top:2px;line-height:1.15}
  .sub{display:flex;gap:12px;align-items:center;margin-top:5px;color:var(--muted)}
  .check{width:24px;height:24px;border-radius:50%;border:1px solid var(--c);background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:11px;padding:0}
  .check svg{width:13px;height:13px;color:#fff;opacity:0}
  .row.done .check{background:var(--c);border-color:var(--c)}
  .row.done .check svg{opacity:1}
  .row.done .ttl2{text-decoration:line-through;color:var(--muted)}
  .row.done .node{background:var(--muted)}
  .row.tent .node{background:var(--bg);border:1px dashed var(--c)}
  .row.tent .node svg{color:var(--c)}
  .row.tent .ttl2{font-style:italic;color:var(--accent)}

  /* per-event actions: delete (hover) stacked above the done check */
  .rowacts{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:9px}
  .rowacts .check{margin-top:0}
  .del2{width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;border-radius:50%;opacity:0;transition:opacity .15s,background .15s}
  .row:hover .del2{opacity:1}
  .del2:hover{background:var(--line);color:var(--love)}
  .del2 svg{width:14px;height:14px}
  /* cross-module: jump to The Edit styled for this event (only shown inside Life OS) */
  .wear2{width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:var(--love);display:grid;place-items:center;border-radius:50%;opacity:.4;transition:opacity .15s,background .15s}
  .row:hover .wear2{opacity:1}
  .wear2:hover{background:color-mix(in srgb,var(--love) 16%,transparent)}
  .wear2 svg{width:14px;height:14px}

  /* drag a to-do from the Inbox onto the day */
  .task{cursor:grab}
  .task:active{cursor:grabbing}
  .task.dragging{opacity:.4}
  .timeline.dropping{outline:2px dashed var(--fn-move);outline-offset:-8px;background:rgba(126,138,107,.05);border-radius:12px}
  .timeline.dropping .empty{color:var(--fn-move)}

  .nowrow{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;position:relative;z-index:2;padding:5px 0}
  .nowrow .nt{font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--love);text-align:right}
  .nowrow .nl{height:1px;background:var(--love);position:relative}
  .nowrow .nl::before{content:'';position:absolute;left:-4px;top:-2.5px;width:6px;height:6px;border-radius:50%;background:var(--love)}

  .empty{text-align:center;padding:54px 20px;color:var(--muted)}
  .empty .big{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--ink);margin-bottom:8px}
  .empty>div:not(.big){font-size:13px;letter-spacing:.02em;max-width:300px;margin:0 auto;line-height:1.5}
  .empty .go{margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:10px 18px;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
  .empty .go svg{width:14px;height:14px}

  .fab{position:absolute;right:30px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--ink);border:0;cursor:pointer;color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(27,25,22,.28)}
  .fab svg{width:23px;height:23px}
  .fab:hover{background:var(--accent)}

  /* edit-event modal (double-click a calendar event) */
  .modal-bg{position:fixed;inset:0;background:rgba(27,25,22,.42);display:grid;place-items:center;z-index:60;padding:20px}
  .modal-bg[hidden]{display:none}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;width:340px;max-width:100%;box-shadow:0 20px 50px rgba(27,25,22,.3)}
  .modal-h{font-family:var(--serif);font-weight:500;font-size:23px;margin-bottom:16px;color:var(--ink)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .field>span{font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .field input{font-family:var(--sans);font-weight:300;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%}
  .field input:focus{outline:none;border-color:var(--muted)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
  .modal-foot .spacer{flex:1}
  .modal-foot button{font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-radius:var(--r);padding:9px 15px;cursor:pointer;border:1px solid var(--line)}
  .m-save{background:var(--ink);color:#faf8f4;border-color:var(--ink)}
  .m-save:hover{background:var(--accent)}
  .m-ghost{background:var(--bg);color:var(--muted)}
  .m-ghost:hover{color:var(--ink);border-color:var(--muted)}
  .m-del{background:transparent;border-color:transparent;color:var(--love);padding-left:0}
  .m-del:hover{text-decoration:underline}

<script>
/* ---------- private-link key: remember it, attach to same-origin requests ----------
   The home-screen icon opens …/planner.html?k=<key>. We stash the key in
   localStorage and add it as an X-Day-Key header on our own API calls, so events
   still save even if the standalone-app cookie ever gets dropped by iOS. */
(function(){
  var KEY='';
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('k')){ KEY=p.get('k'); try{localStorage.setItem('tdk',KEY);}catch(e){} }
    else { try{KEY=localStorage.getItem('tdk')||'';}catch(e){KEY='';} }
  }catch(e){}
  if(KEY){
    var _f=window.fetch.bind(window);
    window.fetch=function(input,init){
      init=init||{};
      try{
        var url=(typeof input==='string')?input:(input&&input.url)||'';
        if(url && new URL(url, location.href).origin===location.origin){
          var h=new Headers(init.headers||{});
          h.set('X-Day-Key',KEY);
          init=Object.assign({},init,{headers:h});
        }
      }catch(e){}
      return _f(input,init);
    };
  }
})();
/* ---------- icon library (white line icons) ---------- */
const I = {
  inbox:'<path d="M4 13h4l2 3h4l2-3h4M4 13l2-7h12l2 7v6H4z"/>',
  sparkles:'<path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 14l.7 2 2 .8-2 .8-.7 2-.7-2-2-.8 2-.8z"/>',
  hanger:'<path d="M12 4.4a1.6 1.6 0 0 1 1.6 1.6c0 1.1-1.6 1.2-1.6 2.4"/><path d="M12 8.4 3.9 14a1 1 0 0 0 .6 1.9h15a1 1 0 0 0 .6-1.9L12 8.4z"/>',

  check:'<path d="M5 12l4 5 10-12"/>',

  video:'<rect x="3" y="6.5" width="12" height="11" rx="2.5"/><path d="M15 10l6-3v10l-6-3"/>',
  briefcase:'<rect x="2.5" y="7" width="19" height="13" rx="2.5"/><path d="M8 7V5.2A2 2 0 0 1 10 3.2h4a2 2 0 0 1 2 2V7"/>',
  dumbbell:'<path d="M6 6.5v11M3 9.5v5M18 6.5v11M21 9.5v5M6 12h12"/>',
  waves:'<path d="M2 7c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 12c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/><path d="M2 17c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2"/>',
  mountain:'<path d="M3 19h18L14 7l-3 5-2-3z"/>',
  activity:'<path d="M3 12h4l3 8 4-16 3 8h4"/>',
  bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-8h4M9 9h6l2 8"/>',
  person:'<circle cx="12" cy="5" r="2"/><path d="M12 7v6M7 21l5-8 5 8M6 11h12"/>',
  coffee:'<path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/><path d="M8 4v2M11 4v2"/>',
  phone:'<path d="M5 4h3l2 5-2 1a10 10 0 0 0 5 5l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  home:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 6a3 3 0 0 1 0 6M17 14a6 6 0 0 1 4 6"/>',
  basket:'<path d="M5 9h14l-1.4 10A2 2 0 0 1 15.6 21H8.4A2 2 0 0 1 6.4 19z"/><path d="M9 9l3-5 3 5"/>',
  book:'<path d="M5 4a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h14V4z"/><path d="M19 16H5"/>',
  leaf:'<path d="M5 19c0-8 6-13 14-13 0 8-6 13-14 13z"/><path d="M5 19c3-5 6-7 10-9"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  sync:'<path d="M3.5 12a8.5 8.5 0 0 1 14.5-6M20.5 12a8.5 8.5 0 0 1-14.5 6"/><path d="M18 2.5V6h-3.5M6 21.5V18h3.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/>',
  star:'<path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 6L12 18.6 6.7 19.6l1.1-6L3.4 9.5l6-.8z"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  list:'<path d="M4 7l2 2 3.2-3.4M4 16l2 2 3.2-3.4M13 7h7M13 17h7"/>'
};
function svg(name,cls){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="'+(cls||'')+'">'+(I[name]||I.note)+'</svg>';}
/* swap placeholder tokens in static markup */
// embed-aware: inside the Life OS shell our markup lives in #view-day; standalone it's <body>.
const APPROOT = document.getElementById('view-day') || document.body;
APPROOT.innerHTML = APPROOT.innerHTML
  .replaceAll('__I_inbox__', svg('inbox'))
  .replaceAll('__I_sparkles__', svg('sparkles'))
  .replaceAll('__I_settings__', svg('settings'))
  .replaceAll('__I_sync__', svg('sync'))
  .replaceAll('__I_mail__', svg('mail'))
  .replaceAll('__I_cal__', svg('cal'))
  .replaceAll('__I_list__', svg('list'))
  .replaceAll('__I_plus__', svg('plus'));

/* ---------- real calendar data (Mon 6/15 – Sun 6/21, America/Denver) ---------- */
const COLORS = {focus:'#3a352d',move:'#7e8a6b',water:'#7e95a3',social:'#b54b5a',home:'#7c756a',none:'#a99f8f'};
function meta(t){
  t=t.toLowerCase();
  if(/laundry/.test(t)) return {c:COLORS.home,i:'basket'};
  if(/homework/.test(t)) return {c:COLORS.focus,i:'book'};
  if(/webflow|transfer|work|email|reply/.test(t)) return {c:COLORS.focus,i:'briefcase'};
  if(/lift|gym|barry|barre|core|pilates|legs|glutes|squat|full body|upper body|workout|strength/.test(t)) return {c:COLORS.move,i:'dumbbell'};
  if(/swim|pool/.test(t)) return {c:COLORS.water,i:'waves'};
  if(/hike|walk/.test(t)) return {c:COLORS.move,i:'mountain'};
  if(/\brun\b/.test(t)) return {c:COLORS.move,i:'activity'};
  if(/bike|cycle/.test(t)) return {c:COLORS.move,i:'bike'};
  if(/yoga|stretch/.test(t)) return {c:COLORS.move,i:'person'};
  if(/coffee/.test(t)) return {c:COLORS.social,i:'coffee'};
  if(/call|text|phone|mum|grandparent|adi|derm/.test(t)) return {c:COLORS.social,i:'phone'};
  if(/meeting|aa\b/.test(t)) return {c:COLORS.social,i:'users'};
  if(/be home|home/.test(t)) return {c:COLORS.home,i:'home'};
  if(/plant/.test(t)) return {c:COLORS.move,i:'leaf'};
  if(/rise|wake|shine|alarm/.test(t)) return {c:COLORS.social,i:'sun'};
  return {c:COLORS.none,i:'note'};
}
/* cross-module thread: map a calendar event to a fashion occasion The Edit
   understands (its occbar chips). null = no outfit decision, no "what to wear". */
function occasionOf(t){
  t=(t||'').toLowerCase();
  if(/dinner|drinks|date night|\bdate\b|party|wedding|cocktail|\bbar\b|gala|night out|reservation|birthday|\bclub\b|formal/.test(t)) return 'going-out';
  if(/flight|airport|\btrip\b|vacation|beach|hotel|resort|\btravel|packing|holiday|getaway/.test(t)) return 'vacation';
  if(/gym|strength|lift|barre|barry|pilates|yoga|\brun\b|bike|cycle|swim|workout|hike|tennis|\bcore\b|spin|legs|glutes|squat|upper body|full body|stretch/.test(t)) return 'active';
  if(/work|meeting|call with|client|interview|presentation|standup|stand-up|zoom|webflow|office|deadline|\bsync\b|1:1|onboard/.test(t)) return 'work';
  if(/coffee|lunch|brunch|errand|grocery|shopping|market|museum|gallery|\bwalk\b/.test(t)) return 'casual';
  return null;
}
/* events load from data/calendar.json — Claude refreshes that file from your
   real Google Calendar, so the page is never a frozen copy again. */
let EVENTS = [];
let SYNCED = '';
let LIVE = false;
const WLAB = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function localISO(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function mondayOf(d){const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);x.setHours(0,0,0,0);return x;}
const TODAY = localISO(new Date());
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
let viewMode = 'week';                                  // 'week' | 'month'
let weekAnchor = mondayOf(new Date());                   // Monday of the shown week (Date)
let monthAnchor = new Date(new Date().getFullYear(), new Date().getMonth(), 1); // 1st of shown month
function weekDays(){return WLAB.map((_,i)=>localISO(addDays(weekAnchor,i)));}
let WEEK = weekDays();
let selDay = TODAY;

/* the visible date range [start, end) the current view needs from the API.
   Week = the shown week; Month = the 6-week grid (incl. spill-over days). */
function monthGridStart(){return mondayOf(monthAnchor);}
function currentRange(){
  if(viewMode==='month'){const gs=monthGridStart();return [localISO(gs), localISO(addDays(gs,42))];}
  return [WEEK[0], localISO(addDays(weekAnchor,7))];
}

// client-side cache per range so toggling Week<->Month doesn't refetch within 60s
const _calCache = {};
function _applyCal(rec){EVENTS=rec.events;SYNCED=rec.synced;LIVE=rec.live;}
async function loadCalendar(){
  // /api/calendar?start&end = live Google pull for the visible range (serve.py);
  // falls back to the static week snapshot, then the file directly if serve.py is off.
  const [start,end]=currentRange(), key=start+'|'+end, hit=_calCache[key];
  if(hit && Date.now()-hit.at < 60000){_applyCal(hit);return;}
  const qs='?start='+start+'&end='+end+'&t='+Date.now();
  for(const url of ['/api/calendar'+qs, 'data/calendar.json?t='+Date.now()]){
    try{
      const r = await fetch(url,{cache:'no-store'});
      if(!r.ok) continue;
      const data = await r.json();
      const rec={events:Array.isArray(data.events)?data.events:[], synced:data.generatedAt||'', live:data.live===true, at:Date.now()};
      _calCache[key]=rec; _applyCal(rec);
      return;
    }catch(e){ /* try next source */ }
  }
}

/* ---------- persisted state ---------- */
const KEY='theday:v1';
const def = {
  inbox:[],
  done:{}, tentative:[]
};
let S = load();
function load(){try{return Object.assign({},def,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return JSON.parse(JSON.stringify(def))}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

/* inbox also persists to disk via serve.py (survives a browser clear, and lets
   Claude read your real to-dos for the AI "structure my day" step later) */
let API_INBOX = false;
async function loadInbox(){
  try{
    const r = await fetch('/api/inbox',{cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    S.inbox = Array.isArray(d.inbox)?d.inbox:[];
    API_INBOX = true;
  }catch(e){ API_INBOX = false; /* fall back to localStorage inbox */ }
}
function saveInbox(){
  save();
  if(API_INBOX){ fetch('/api/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inbox:S.inbox})}).catch(()=>{}); }
}

/* ---------- helpers ---------- */
function toMin(hm){const[a,b]=hm.split(':').map(Number);return a*60+b}
function fmt(hm){let[h,m]=hm.split(':').map(Number);const ap=h<12?'AM':'PM';let hh=h%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')+' '+ap}
function bare(hm){let[h,m]=hm.split(':').map(Number);let hh=h%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')}
function durLabel(s,e){let d=toMin(e)-toMin(s);const h=Math.floor(d/60),m=d%60;let o=[];if(h)o.push(h+(h>1?' hr':' hour'));if(m)o.push(m+' min');return o.join(' ')}
function dayEvents(day){
  const real = EVENTS.filter(x=>x.day===day && !x.allDay).map(x=>Object.assign({},x));
  const tent = S.tentative.filter(x=>x.day===day).map(x=>Object.assign({tent:true},x));
  return real.concat(tent).sort((a,b)=>toMin(a.s)-toMin(b.s));
}
function evKey(ev){return ev.day+'|'+ev.t+'|'+(ev.s||'')}

/* ---------- toast ---------- */
let tTimer;const toastEl=document.getElementById('toast');
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>toastEl.classList.remove('show'),3400)}

/* ---------- render: inbox ---------- */
function renderInbox(){
  const items = S.inbox.map(task=>{
    const m=meta(task.cat||task.t);
    const dur = task.mins>=60?(task.mins/60)+' hr':task.mins+' min';
    return `<div class="task ${task.sched?'sched':''}" draggable="true" data-task="${task.id}" title="Drag onto your day, or tap + to schedule">
      <div class="chip" style="color:${m.c}">${svg(m.i)}</div>
      <div><div class="dur">${dur}</div><div class="ttl">${task.t}</div></div>
      <div class="acts">
        <button class="del" data-del="${task.id}" title="Delete to-do">${svg('x')}</button>
        <button class="add" data-add="${task.id}" title="Schedule into your day">${svg('plus')}</button>
      </div>
    </div>`;
  }).join('');
  const empty = `<div style="color:var(--muted);font-size:13px;line-height:1.5;padding:10px 4px">Your inbox is empty. Tap + above to add a to-do, then drag it onto your day (or use the + on it).</div>`;
  // render into the desktop rail (#inbox) AND the mobile pull-up tray (#inboxTray)
  ['inbox','inboxTray'].forEach(id=>{

/* ---------- render: month grid (GCal-style) ---------- */
function renderMonth(){
  const grid=document.getElementById('monthGrid'); if(!grid) return;
  const gs=monthGridStart(), cur=monthAnchor.getMonth();
  let html='';
  for(let i=0;i<42;i++){
    const d=addDays(gs,i), iso=localISO(d), out=d.getMonth()!==cur;
    const evs=EVENTS.filter(x=>x.day===iso)
      .sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0) || toMin(a.s||'0:00')-toMin(b.s||'0:00'));
    const shown=evs.slice(0,3).map(x=>{
      const m=meta(x.t), tm=x.allDay?'':bare(x.s)+' ';
      return `<div class="mev"><i style="background:${m.c}"></i><span>${tm}${esc(x.t)}</span></div>`;
    }).join('');
    const more=evs.length>3?`<div class="more">+${evs.length-3} more</div>`:'';
    html+=`<div class="mcell ${out?'out':''} ${iso===TODAY?'today':''}" data-day="${iso}">
      <div class="mnum">${d.getDate()}</div>${shown}${more}</div>`;
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.mcell:not(.out)').forEach(c=>c.onclick=()=>{
    selDay=c.dataset.day; weekAnchor=mondayOf(new Date(selDay+'T00:00')); WEEK=weekDays(); setView('week');

/* ---------- render: timeline ---------- */
function renderTimeline(){
  const tl=document.getElementById('timeline');
  const evs=dayEvents(selDay);
  const allday=EVENTS.filter(x=>x.day===selDay&&x.allDay);
  let html='';

  allday.forEach(a=>{html+=`<div class="allday"><span class="tag">ALL DAY</span> ${a.t}</div>`;});

  if(!evs.length){
    html+=`<div class="empty">
      <div class="big">${selDay===TODAY?'Nothing scheduled today':'No events this day'}</div>
      <div>Pull a to-do over from your Inbox, or let AI lay out your day around your free time.</div>
      <button class="go" id="emptyAi">${svg('sparkles')} Structure my day</button>
    </div>`;
    tl.innerHTML=html;
    const ea=document.getElementById('emptyAi'); if(ea) ea.onclick=aiStub;
    return;
  }

  const now=new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const isToday = selDay===TODAY;
  let nowPlaced=false;

  // free time between events becomes vertical space, proportional to the gap
  let prevEnd=null;
  const gapDiv=mins=>{const px=Math.max(0,Math.min(160,Math.round(mins*0.55)));return px>0?`<div class="gap" style="height:${px}px"></div>`:'';};

  evs.forEach((ev,idx)=>{
    const m=meta(ev.t);
    const done=!!S.done[evKey(ev)];
    const durMin=Math.max(0,toMin(ev.e)-toMin(ev.s));
    // ≤1hr stays the original 44px circle; only events longer than an hour grow
    const nodeH=Math.min(168,44+Math.round(Math.max(0,durMin-60)*0.9));
    const startMin=toMin(ev.s);
    const lead = prevEnd!==null ? startMin-prevEnd : 0;
    if(isToday && !nowPlaced && startMin>nowMin){
      if(prevEnd!==null && nowMin>=prevEnd){          // now sits inside the free gap → split it around the marker
        html+=gapDiv(nowMin-prevEnd)+nowRow(nowMin)+gapDiv(startMin-nowMin);
      }else{
        html+=(lead>0?gapDiv(lead):'')+nowRow(nowMin);
      }
      nowPlaced=true;
    }else if(lead>0){
      html+=gapDiv(lead);
    }
    html+=`<div class="row ${done?'done':''} ${ev.tent?'tent':''} ${durMin>60?'long':''}" data-k="${encodeURIComponent(evKey(ev))}" data-id="${ev.id||''}" data-s="${ev.s}" data-e="${ev.e}" style="--c:${m.c};--nh:${nodeH}px" title="Double-click to edit">
      <div class="time">${bare(ev.s)}<small>${bare(ev.e)}</small></div>
      <div class="node">${svg(m.i)}</div>
      <div class="body">
        <div class="meta">${fmt(ev.s)} to ${fmt(ev.e)} (${durLabel(ev.s,ev.e)})${ev.tent?' · tentative':''}</div>
        <div class="ttl2">${ev.t}</div>
      </div>
      <div class="rowacts">
        ${(occasionOf(ev.t)&&window.LifeOS)?`<button class="wear2" data-occ="${occasionOf(ev.t)}" title="What to wear">${svg('hanger')}</button>`:''}
        <button class="del2" title="Delete from calendar">${svg('x')}</button>
        <button class="check" title="Mark done">${svg('check')}</button>
      </div>
    </div>`;
    prevEnd=toMin(ev.e);
  });
  if(isToday && !nowPlaced) html+=gapDiv(prevEnd!==null?Math.max(0,nowMin-prevEnd):0)+nowRow(nowMin);

  tl.innerHTML=html;
  tl.querySelectorAll('.row').forEach(r=>{
    r.querySelector('.check').onclick=()=>{const k=decodeURIComponent(r.dataset.k);S.done[k]=!S.done[k];save();renderTimeline()};
    r.querySelector('.del2').onclick=()=>deleteEvent(r);
    const wb=r.querySelector('.wear2');
    if(wb) wb.onclick=(e)=>{e.stopPropagation(); window.LifeOS&&window.LifeOS.goToEdit(wb.dataset.occ,{title:r.querySelector('.ttl2').textContent.trim(),time:fmt(r.dataset.s)});};
    r.ondblclick=(e)=>{if(e.target.closest('.rowacts'))return; openEditor(r);};
    const bodyEl=r.querySelector('.body');                      // mobile: single tap opens the editor (no hover/dblclick on touch)
    if(bodyEl) bodyEl.onclick=()=>{ if(window.matchMedia('(max-width:760px)').matches) openEditor(r); };
  });
}
function nowRow(nowMin){
  const h=Math.floor(nowMin/60),mm=nowMin%60;
  return `<div class="nowrow"><div class="nt">${bare(h+':'+String(mm).padStart(2,'0'))}</div><div class="nl"></div></div>`;
}

/* ---------- actions ---------- */
const AUTH_MSG = 'Turn on calendar editing first: open Terminal, run  python3 auth_google.py  (tick “make changes to events”), then reload.';

function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function dayFloor(){return selDay===TODAY?Math.max(8*60,Math.ceil(nowMin()/30)*30):9*60;}
function hhmm(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function dayWord(d){if(d===TODAY)return 'today';return WLAB[(new Date(d+'T00:00').getDay()+6)%7];}

/* re-pull the live calendar and re-render, without the refresh button's toast */
function bustCal(){for(const k in _calCache) delete _calCache[k];}  // drop client cache after a write/refresh
async function reloadCalendar(){bustCal();await loadCalendar();renderAll();}

/* first non-clashing slot of length `len` at/after anchorMin (15-min grid) */
function findSlot(anchorMin,len){
  const evs=dayEvents(selDay).map(e=>[toMin(e.s),toMin(e.e)]).sort((a,b)=>a[0]-b[0]);
  let cursor=Math.ceil(Math.max(anchorMin,0)/15)*15,guard=0;
  while(guard++<200){
    const clash=evs.find(([a,b])=>cursor<b && cursor+len>a);
    if(!clash) return cursor;
    cursor=Math.ceil(clash[1]/15)*15;
    if(cursor+len>24*60) return null;
  }
  return null;
}
/* a drop near clientY wants to start in the gap just below the row above it */
function anchorFromDrop(clientY){
  let prevEnd=dayFloor();
  for(const r of document.querySelectorAll('#timeline .row')){
    const rect=r.getBoundingClientRect();
    if(clientY<rect.top+rect.height/2) break;
    prevEnd=toMin(r.dataset.e);
  }
  return Math.max(prevEnd,dayFloor());
}

/* place an inbox to-do onto the day → a real Google event (local pencil if no server) */
async function placeTask(id,anchorMin){
  const task=S.inbox.find(x=>x.id===id); if(!task) return;
  const len=task.mins||30;
  const start=findSlot(anchorMin,len);
  if(start===null){toast('No free slot there. Try another spot, or another day.');return;}
  const s=hhmm(start),e=hhmm(start+len);
  if(API_INBOX){
    try{
      const res=await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'create',day:selDay,s,e,t:task.t})});
      const j=await res.json().catch(()=>({}));
      if(res.ok&&j.ok){
        S.inbox=S.inbox.filter(x=>x.id!==id); saveInbox(); renderInbox();
        await reloadCalendar();
        toast(`Added “${task.t}” to ${dayWord(selDay)} at ${fmt(s)}.`);
      }else if(j.needAuth){toast(AUTH_MSG);}
      else{toast('Could not add: '+(j.error||('HTTP '+res.status)));}
    }catch(err){toast('Could not reach the server to add the event.');}
  }else{
    S.tentative.push({day:selDay,s,e,t:task.t}); task.sched=true; saveInbox();
    renderInbox(); renderTimeline();
    toast(`Penciled “${task.t}” at ${fmt(s)} (open via the “Open The Day” launcher to save it to Google).`);
  }
}
function schedule(id){placeTask(id,dayFloor());}

/* a calendar row's identity, used by delete + edit */
function rowRef(r){return {id:r.dataset.id, k:decodeURIComponent(r.dataset.k), day:selDay,
  s:r.dataset.s, e:r.dataset.e, title:(r.querySelector('.ttl2')||{}).textContent||'this event'};}

/* delete a calendar event — real Google event if it has an id, else a local pencil */
async function deleteByRef(ref){
  const {id,k,day,s,title}=ref;
  if(!confirm(`Delete “${title}” from your calendar?`)) return;
  if(id){
    try{
      const res=await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'delete',id})});
      const j=await res.json().catch(()=>({}));
      if(res.ok&&j.ok){if(k)delete S.done[k]; save(); await reloadCalendar(); toast(`Deleted “${title}”.`);}
      else if(j.needAuth){toast(AUTH_MSG);}
      else{toast('Could not delete: '+(j.error||('HTTP '+res.status)));}
    }catch(err){toast('Could not reach the server to delete.');}
  }else{
    S.tentative=S.tentative.filter(x=>!(x.day===day&&x.t===title&&x.s===s));
    save(); renderTimeline(); toast(`Removed “${title}”.`);
  }
}

function closeEditor(){$ed('editBg').hidden=true; editing=null;}
async function saveEditor(){
  if(!editing) return;
  const day=$ed('edDate').value||editing.day;
  const s=$ed('edStart').value, e=$ed('edEnd').value;
  const tIn=$ed('edTitle').value.trim();
  if(editing.isNew && !tIn){toast('Give your event a title.');return;}
  if(!day){toast('Pick a date.');return;}
  if(!s||!e){toast('Pick a start and end time.');return;}
  if(toMin(e)<=toMin(s)){toast('The end time has to be after the start time.');return;}
  const t=tIn||editing.title;
  if(editing.isNew){
    try{
      const res=await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'create',day,s,e,t})});
      const j=await res.json().catch(()=>({}));
      if(res.ok&&j.ok){
        closeEditor();
        selDay=day; weekAnchor=mondayOf(new Date(day+'T00:00')); WEEK=weekDays();
        await reloadCalendar();
        toast(`Added “${t}” on ${dayWord(day)} at ${fmt(s)}.`);
      }else if(j.needAuth){toast(AUTH_MSG);}
      else{toast('Could not add: '+(j.error||('HTTP '+res.status)));}
    }catch(err){toast('Could not reach the server to add the event.');}
    return;
  }
  if(editing.id){
    try{
      const res=await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'update',id:editing.id,day,s,e,t})});
      const j=await res.json().catch(()=>({}));
      if(res.ok&&j.ok){closeEditor(); if(day!==editing.day){selDay=day; weekAnchor=mondayOf(new Date(day+'T00:00')); WEEK=weekDays();} await reloadCalendar(); toast(`Updated “${t}”.`);}
      else if(j.needAuth){toast(AUTH_MSG);}
      else{toast('Could not save: '+(j.error||('HTTP '+res.status)));}
    }catch(err){toast('Could not reach the server to save.');}
  }else{
    const te=S.tentative.find(x=>x.day===editing.day&&x.t===editing.title&&x.s===editing.s);
    if(te){te.s=s;te.e=e;te.t=t;te.day=day;save();}
    closeEditor(); renderTimeline(); toast(`Updated “${t}”.`);
  }
}

(function wireDropZone(){
  const tl=document.getElementById('timeline');
  tl.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';tl.classList.add('dropping');});
  tl.addEventListener('dragleave',e=>{if(!tl.contains(e.relatedTarget))tl.classList.remove('dropping');});
  tl.addEventListener('drop',e=>{

/* ---------- pressing emails (left column) ---------- */
let MAIL = [];                 // [{from,email,subject,snippet,date,threadId,unread,starred}]
let MAIL_LIVE = false;
let MAIL_NEED_GMAIL = false;
let MAIL_CAN_REPLY = false;    // AI drafting available (ANTHROPIC_API_KEY present)
let MAIL_CAN_SEND = false;     // token has the gmail.send scope
async function loadEmails(){
  // /api/emails = live Gmail (serve.py, read-only); falls back to the saved
  // data/emails.json snapshot, then to the file directly if serve.py is off.
  for(const url of ['/api/emails?t='+Date.now(), 'data/emails.json?t='+Date.now()]){
    try{
      const r = await fetch(url,{cache:'no-store'});
      if(!r.ok) continue;
      const data = await r.json();
      MAIL = Array.isArray(data.emails)?data.emails:[];
      MAIL_LIVE = data.live===true;
      MAIL_NEED_GMAIL = data.needGmail===true;
      MAIL_CAN_REPLY = data.canReply===true;
      MAIL_CAN_SEND = data.canSend===true;
      return;
    }catch(e){ /* try next source */ }
  }
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtMailDate(s){
  const d=new Date(s); if(isNaN(d)) return '';
  const z=n=>String(n).padStart(2,'0'), iso=x=>x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());
  const today=new Date(); if(iso(d)===iso(today)) return 'Today';
  const yest=new Date(today); yest.setDate(today.getDate()-1);
  if(iso(d)===iso(yest)) return 'Yesterday';
  return MON[d.getMonth()].slice(0,3)+' '+d.getDate();
}
function renderEmails(){
  const el=document.getElementById('mlist'); if(!el) return;
  const cnt=document.getElementById('mailCount'); if(cnt) cnt.textContent = MAIL.length ? ('· '+MAIL.length) : '';
  const md=document.querySelector('.mtab[data-mtab="mail"]'); if(md) md.classList.toggle('has-dot', MAIL.some(m=>m.unread));
  if(!MAIL.length){
    el.innerHTML = `<div class="mail-empty"><div class="big">Nothing pressing</div><div>No unread or starred emails waiting on a reply.</div></div>`;
    return;
  }
  let html = MAIL.map((m,i)=>{
    const url='https://mail.google.com/mail/u/0/#all/'+encodeURIComponent(m.threadId||m.id);
    const tid=esc(m.threadId||m.id);
    let badges='';
    if(m.unread) badges+='<span class="mc-badge unread"><span class="dot"></span>Unread</span>';
    if(m.starred) badges+='<span class="mc-badge star">'+svg('star')+'Starred</span>';
    return `<div class="mcard ${m.unread?'unread':''}" data-thread="${tid}" data-i="${i}">
      <a class="mc-open" href="${url}" target="_blank" rel="noopener" title="Open in Gmail">
        <div class="mc-top">
          <div class="mc-chip">${svg('mail')}</div>
          <div class="mc-from">${esc(m.from)}</div>
          <div class="mc-date">${fmtMailDate(m.date)}</div>
        </div>
        <div class="mc-subj">${esc(m.subject)}</div>
        <div class="mc-snip">${esc(m.snippet)}</div>
      </a>
      ${badges?`<div class="mc-badges">${badges}</div>`:''}
      <div class="mc-actions"><button class="mc-reply" data-act="reply">${svg('mail')} Reply</button></div>
      <div class="mc-compose" hidden></div>
    </div>`;
  }).join('');
  if(MAIL_NEED_GMAIL && !MAIL_LIVE){
    html += `<div class="mail-note">Showing a saved snapshot. For live email, run <b>python3 auth_google.py</b> and tick “read your email,” then reload.</div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.mc-reply').forEach(b=>b.onclick=()=>openReply(b.closest('.mcard')));
}

/* ---------- reply composer ---------- */
function openReply(card){
  if(!card) return;
  const box=card.querySelector('.mc-compose');
  if(!box.hidden){ box.hidden=true; box.innerHTML=''; return; }  // toggle closed
  box.hidden=false;
  const sendBtn = MAIL_CAN_SEND
    ? `<button class="mc-send" data-act="send">Send</button>`
    : `<button class="mc-send" data-act="send" disabled>Send</button>`;
  box.innerHTML = `
    <textarea class="mc-text" placeholder="Write your reply, or generate a draft…"></textarea>
    <div class="mc-cbtns">
      <button class="mc-gen" data-act="gen"><span class="spk">${svg('sparkles')}</span> <span class="genlbl">Generate draft</span></button>
      <span class="spacer"></span>
      <button class="mc-cancel" data-act="cancel">Cancel</button>
      ${sendBtn}
    </div>
    ${MAIL_CAN_SEND?'':`<div class="mc-hint">Sending isn’t enabled yet. Run <b>python3 auth_google.py</b> (keep “Send email on your behalf” checked), then reload. You can still draft and edit here.</div>`}`;
  box.querySelector('[data-act=gen]').onclick=()=>genDraft(card);
  box.querySelector('[data-act=cancel]').onclick=()=>{box.hidden=true;box.innerHTML='';};
  const sb=box.querySelector('[data-act=send]'); if(sb&&MAIL_CAN_SEND) sb.onclick=()=>sendDraft(card);
  if(MAIL_CAN_REPLY) genDraft(card);          // auto-draft on open
  else box.querySelector('.mc-text').focus();
}
async function genDraft(card){
  const box=card.querySelector('.mc-compose'), ta=box.querySelector('.mc-text');
  const gen=box.querySelector('[data-act=gen]'), lbl=gen.querySelector('.genlbl');
  const tid=card.dataset.thread;
  gen.disabled=true; const prev=lbl.textContent; lbl.textContent='Drafting…';
  ta.setAttribute('data-busy','1');
  try{
    const r=await fetch('/api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threadId:tid})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){ ta.value=j.draft||''; lbl.textContent='Regenerate'; ta.focus(); }
    else if(j.needGmail){ toast('Connect Gmail first: run python3 auth_google.py.'); lbl.textContent=prev; }
    else { toast('Could not draft: '+(j.error||('HTTP '+r.status))); lbl.textContent=prev; }
  }catch(e){ toast('Could not reach the server to draft.'); lbl.textContent=prev; }
  finally{ gen.disabled=false; ta.removeAttribute('data-busy'); }
}
async function sendDraft(card){
  const box=card.querySelector('.mc-compose'), ta=box.querySelector('.mc-text');
  const sb=box.querySelector('[data-act=send]'), tid=card.dataset.thread;
  const body=(ta.value||'').trim();
  if(!body){ toast('Write something first.'); return; }
  sb.disabled=true; const prev=sb.textContent; sb.textContent='Sending…';
  try{
    const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({threadId:tid,body})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){
      box.innerHTML=`<div class="mc-hint"><b>Sent.</b> Your reply is on its way.</div>`;
      const i=Number(card.dataset.i); toast('Reply sent'+(MAIL[i]?` to ${MAIL[i].from}.`:'.'));
    }else if(j.needSend){ sb.textContent=prev; sb.disabled=false; toast(j.error||'Sending isn’t authorized yet.'); }
    else { sb.textContent=prev; sb.disabled=false; toast('Could not send: '+(j.error||('HTTP '+r.status))); }
  }catch(e){ sb.textContent=prev; sb.disabled=false; toast('Could not reach the server to send.'); }
}
async function reloadEmails(){await loadEmails();renderEmails();}
document.getElementById('mailRefresh').onclick=()=>{reloadEmails();toast('Refreshed pressing emails.');};

/* ---------- boot ---------- */
function renderAll(){
  renderHeader();
  if(viewMode==='month'){ renderMonth(); }
  else { renderWeek(); renderTimeline(); }
  renderInbox(); renderEmails(); renderSynced();
}
async function boot(){
  renderAll();                                  // instant shell (header, week)
  await loadCalendar(); renderAll();            // calendar paints first — the view you land on
  loadInbox().then(renderInbox);                // to-dos fill in async
  loadEmails().then(renderEmails);              // pressing emails fill in async (slowest source)
}
boot();
</script>
