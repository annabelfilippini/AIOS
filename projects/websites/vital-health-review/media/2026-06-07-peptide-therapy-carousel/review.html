<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vital Health Peptide Therapy Carousel Review</title>
  <style>
    body { margin: 0; background: #ede6d7; color: #12351e; font-family: Inter, Arial, sans-serif; }
    main { max-width: 1500px; margin: 0 auto; padding: 44px 24px 72px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 32px; border-bottom: 1px solid rgba(18,53,30,.16); padding-bottom: 24px; margin-bottom: 28px; }
    h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 36px; }
    p { margin: 0; max-width: 660px; color: #676359; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
    figure { margin: 0; background: #ded3b8; border: 1px solid rgba(18,53,30,.14); padding: 10px; }
    img { width: 100%; display: block; aspect-ratio: 4 / 5; object-fit: cover; }
    figcaption { padding-top: 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #676359; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Vital Health Peptide Therapy Carousel</h1>
      <p>Eight-slide educational carousel. Built to explain peptides carefully without turning the post into a treatment menu.</p>
    </header>
    <section class="grid">
    <figure>
      <img src="slide-1.png" alt="Slide 1: Peptide Therapy">
      <figcaption>01 Peptide Therapy</figcaption>
    </figure>
    <figure>
      <img src="slide-2.png" alt="Slide 2: What They Are">
      <figcaption>02 What They Are</figcaption>
    </figure>
    <figure>
      <img src="slide-3.png" alt="Slide 3: Why Personal">
      <figcaption>03 Why Personal</figcaption>
    </figure>
    <figure>
      <img src="slide-4.png" alt="Slide 4: When Appropriate">
      <figcaption>04 When Appropriate</figcaption>
    </figure>
    <figure>
      <img src="slide-5.png" alt="Slide 5: Labs And History">
      <figcaption>05 Labs And History</figcaption>
    </figure>
    <figure>
      <img src="slide-6.png" alt="Slide 6: Examples">
      <figcaption>06 Examples</figcaption>
    </figure>
    <figure>
      <img src="slide-7.png" alt="Slide 7: Vital Health Approach">
      <figcaption>07 Vital Health Approach</figcaption>
    </figure>
    <figure>
      <img src="slide-8.png" alt="Slide 8: How To Ask">
      <figcaption>08 How To Ask</figcaption>
    </figure></section>
  </main>
</body>
</html>
