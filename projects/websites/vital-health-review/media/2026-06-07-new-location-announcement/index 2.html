<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vital Health New Location Announcement</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --forest: #1f4d2a;
      --deep-forest: #12351e;
      --cream: #f5efe0;
      --paper: #fbf7ec;
      --sage: #dce5d5;
      --gold: #c9a04a;
      --terracotta: #c77a4a;
      --peach: #e9c8aa;
      --ink: #2a2a26;
      --muted: #676359;
    }

    html,
    body {
      min-height: 100%;
      background: #e8dfcb;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      justify-content: center;
      padding: 48px;
    }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    .serif {
      font-family: Fraunces, Georgia, "Times New Roman", serif;
      font-weight: 400;
      letter-spacing: 0;
    }

    .italic {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0;
    }

    .rule {
      display: block;
      width: 72px;
      height: 2px;
      background: var(--gold);
    }

    .bird {
      width: 62px;
      height: auto;
      object-fit: contain;
    }

    .deep .bird {
      filter: brightness(0) invert(92%) sepia(14%) saturate(489%) hue-rotate(4deg) brightness(104%) contrast(95%);
      opacity: 0.92;
    }

    .s1 {
      background:
        linear-gradient(135deg, rgba(18, 53, 30, 0.96), rgba(31, 77, 42, 0.93)),
        var(--deep-forest);
      color: var(--cream);
    }

    .s1::before {
      content: "";
      position: absolute;
      inset: 92px -180px auto auto;
      width: 720px;
      height: 720px;
      border: 1px solid rgba(201, 160, 74, 0.26);
      transform: rotate(24deg);
    }

    .s1::after {
      content: "";
      position: absolute;
      inset: auto auto -160px -100px;
      width: 650px;
      height: 650px;
      border: 1px solid rgba(245, 239, 224, 0.12);
      transform: rotate(-18deg);
    }

    .s1 .top {
      position: absolute;
      top: 70px;
      left: 78px;
      right: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 3;
    }

    .s1 .brand {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(245, 239, 224, 0.78);
    }

    .s1 .panel {
      position: absolute;
      left: 76px;
      right: 76px;
      top: 210px;
      bottom: 92px;
      z-index: 4;
      display: grid;
      grid-template-columns: 0.98fr 1.02fr;
      gap: 54px;
      align-items: center;
    }

    .s1 h1 {
      margin-top: 30px;
      max-width: 580px;
      color: var(--cream);
      font-size: 122px;
      line-height: 0.92;
    }

    .s1 h1 em {
      color: var(--peach);
    }

    .s1 .sub {
      margin-top: 36px;
      max-width: 470px;
      color: rgba(245, 239, 224, 0.82);
      font-size: 31px;
      line-height: 1.42;
      font-weight: 350;
    }

    .address-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-self: center;
      justify-self: center;
      width: 440px;
      min-height: 440px;
      padding: 54px;
      background: rgba(251, 247, 236, 0.94);
      color: var(--deep-forest);
      border: 1px solid rgba(201, 160, 74, 0.46);
      box-shadow: 0 34px 80px rgba(0, 0, 0, 0.16);
    }

    .address-card .label {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .address-card .address-lines {
      margin-top: 36px;
      font-size: 33px;
      line-height: 1.2;
      color: var(--deep-forest);
    }
  </style>
</head>
<body>
  <article class="slide s1 deep" id="slide-1">
    <div class="top">
      <img class="bird" src="vh-bird-logo.png" alt="Vital Health hummingbird">
      <div class="brand">Vital Health Integrative Medicine</div>
    </div>
    <div class="panel">
      <section>
        <span class="rule"></span>
        <h1 class="serif">Vital Health<br><em class="italic">is moving.</em></h1>
        <p class="sub">Please note our new West Austin address for upcoming visits.</p>
      </section>
      <aside class="address-card">
        <div class="label">
          <span>New address</span>
          <span class="rule"></span>
        </div>
        <div class="address-lines serif">500 N Capital<br>of Texas Hwy<br>Bldg 6, Suite 125<br>Austin, TX 78746</div>
      </aside>
    </div>
  </article>
</body>
</html>
