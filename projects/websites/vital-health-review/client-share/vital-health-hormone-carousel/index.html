<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vital Health Instagram Carousel Review</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --forest: #12351e;
      --cream: #ede6d7;
      --paper: #fbf7ee;
      --muted: #676359;
      --gold: #b99445;
      --line: rgba(18, 53, 30, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--forest);
      font-family: Inter, Arial, sans-serif;
    }

    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 44px 24px 72px;
    }

    header {
      align-items: end;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 32px;
      justify-content: space-between;
      margin-bottom: 22px;
      padding-bottom: 24px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.05;
      margin: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
      margin: 0;
      max-width: 650px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin: 0 0 26px;
    }

    .tab-button {
      appearance: none;
      background: rgba(251, 247, 238, 0.62);
      border: 1px solid rgba(18, 53, 30, 0.18);
      color: var(--forest);
      cursor: pointer;
      font: 600 13px/1 Inter, Arial, sans-serif;
      letter-spacing: 0.08em;
      padding: 13px 16px;
      text-transform: uppercase;
    }

    .tab-button[aria-selected="true"] {
      background: var(--forest);
      border-color: var(--forest);
      color: var(--paper);
    }

    .panel {
      display: none;
    }

    .panel.is-active {
      display: block;
    }

    .intro-frame-wrap {
      background: #ded3b8;
      border: 1px solid rgba(18, 53, 30, 0.14);
      padding: 10px;
    }

    .intro-frame {
      background: var(--paper);
      border: 0;
      display: block;
      height: 86vh;
      min-height: 760px;
      width: 100%;
    }

    .grid {
      display: grid;
      gap: 22px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    figure {
      background: #ded3b8;
      border: 1px solid rgba(18, 53, 30, 0.14);
      margin: 0;
      padding: 10px;
    }

    img {
      aspect-ratio: 1 / 1;
      display: block;
      object-fit: cover;
      width: 100%;
    }

    img.portrait-post {
      aspect-ratio: 4 / 5;
      object-fit: contain;
    }

    .moving-shot {
      display: block;
      margin: 0 auto;
      max-width: 360px;
    }

    .moving-shot figure {
      background: transparent;
      border: 0;
      padding: 0;
    }

    .moving-shot img.portrait-post {
      border: 1px solid rgba(18, 53, 30, 0.14);
      width: 100%;
    }

    .moving-shot figcaption {
      padding-top: 12px;
    }

    figcaption {
      color: var(--muted);
      display: flex;
      font-size: 12px;
      justify-content: space-between;
      letter-spacing: 0.08em;
      padding-top: 10px;
      text-transform: uppercase;
    }

    a {
      color: var(--forest);
      text-decoration-color: rgba(185, 148, 69, 0.65);
      text-underline-offset: 3px;
    }

    @media (max-width: 760px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .tabs {
        flex-direction: column;
      }

      .intro-frame {
        height: 75vh;
        min-height: 560px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Vital Health Instagram Carousels</h1>
      <p>Review the final intro carousel, the hormone optimization carousel, the peptides carousel, and the moving announcement in one place. Use the tabs below to switch between them.</p>
    </header>

    <nav class="tabs" aria-label="Carousel tabs">
      <button class="tab-button" id="tab-intro" type="button" role="tab" aria-selected="true" aria-controls="panel-intro">Intro Carousel</button>
      <button class="tab-button" id="tab-hormone" type="button" role="tab" aria-selected="false" aria-controls="panel-hormone">Hormone Optimization</button>
      <button class="tab-button" id="tab-peptides" type="button" role="tab" aria-selected="false" aria-controls="panel-peptides">Peptides</button>
      <button class="tab-button" id="tab-moving" type="button" role="tab" aria-selected="false" aria-controls="panel-moving">Moving Announcement</button>
    </nav>

    <section class="panel is-active" id="panel-intro" role="tabpanel" aria-labelledby="tab-intro">
      <div class="intro-frame-wrap">
        <iframe class="intro-frame" src="intro-carousel-review.html" title="Vital Health intro carousel review"></iframe>
      </div>
    </section>

    <section class="panel" id="panel-hormone" role="tabpanel" aria-labelledby="tab-hormone">
      <section class="grid">
        <figure>
          <a href="slide-1.png"><img src="slide-1.png" alt="Slide 1: Hormone Optimization"></a>
          <figcaption><span>01 Hormone Optimization</span><a href="slide-1.png">Open</a></figcaption>
        </figure>
        <figure>
          <a href="slide-2.png"><img src="slide-2.png" alt="Slide 2: Women"></a>
          <figcaption><span>02 Women</span><a href="slide-2.png">Open</a></figcaption>
        </figure>
        <figure>
          <a href="slide-3.png"><img src="slide-3.png" alt="Slide 3: Men"></a>
          <figcaption><span>03 Men</span><a href="slide-3.png">Open</a></figcaption>
        </figure>
        <figure>
          <a href="slide-4.png"><img src="slide-4.png" alt="Slide 4: What we treat"></a>
          <figcaption><span>04 What We Treat</span><a href="slide-4.png">Open</a></figcaption>
        </figure>
      </section>
    </section>

    <section class="panel" id="panel-peptides" role="tabpanel" aria-labelledby="tab-peptides">
      <section class="grid">
        <figure>
          <a href="peptides/slide-1.png"><img src="peptides/slide-1.png" alt="Slide 1: Peptides"></a>
          <figcaption><span>01 Peptides</span><a href="peptides/slide-1.png">Open</a></figcaption>
        </figure>
        <figure>
          <a href="peptides/slide-2.png"><img src="peptides/slide-2.png" alt="Slide 2: What peptides are"></a>
          <figcaption><span>02 What Peptides Are</span><a href="peptides/slide-2.png">Open</a></figcaption>
        </figure>
        <figure>
          <a href="peptides/slide-3.png"><img src="peptides/slide-3.png" alt="Slide 3: Protocols we may discuss"></a>
          <figcaption><span>03 Protocols We May Discuss</span><a href="peptides/slide-3.png">Open</a></figcaption>
        </figure>
      </section>
    </section>

    <section class="panel" id="panel-moving" role="tabpanel" aria-labelledby="tab-moving">
      <section class="moving-shot">
        <figure>
          <a href="we-are-moving.png"><img class="portrait-post" src="we-are-moving.png" alt="Vital Health is moving announcement"></a>
          <figcaption><span>01 Moving Announcement</span><a href="we-are-moving.png">Open</a></figcaption>
        </figure>
      </section>
    </section>
  </main>

  <script>
    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));

    function activateTab(tab) {
      tabs.forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
      panels.forEach((panel) => panel.classList.toggle('is-active', panel.id === tab.getAttribute('aria-controls')));
    }

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => activateTab(tab));
    });
  </script>
</body>
</html>
