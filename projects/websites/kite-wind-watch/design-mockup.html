<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kite Wind Watch — map-first restructure (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16243d; --ink-soft:#45577a; --muted:#8492ad;
    --navy:#1c3d6e; --navy-2:#2f6bb0;
    --line:#dce3f0;
    --good:#2fbf91; --marg:#5aa9f7; --light:#9aa6c4; --strong:#f5a623; --nuke:#ef5a78;
    --panel:rgba(252,253,255,.86);
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans:"Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--sans); color:var(--ink); background:#0d1a2e;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .app{position:fixed; inset:0;}

  /* ============ MAP CANVAS (faked satellite/terrain, self-contained) ============ */
  .map{position:absolute; inset:0; overflow:hidden;}
  .map svg{position:absolute; inset:0; width:100%; height:100%;}
  .pin{
    position:absolute; transform:translate(-50%,-50%); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; z-index:3;
  }
  .pin .dot{
    width:18px; height:18px; background:var(--c); border:2px solid #fff;
    box-shadow:0 3px 10px rgba(10,25,50,.45); transition:transform .12s ease;
  }
  .pin.sel .dot{ width:24px; height:24px; box-shadow:0 0 0 3px rgba(255,255,255,.55),0 6px 16px rgba(10,25,50,.5); }
  .pin .lbl{
    margin-top:5px; font-size:10.5px; font-weight:600; letter-spacing:.02em;
    color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.85); white-space:nowrap;
    opacity:.92; max-width:120px; text-align:center; line-height:1.15;
  }
  .pin .kt{ font-family:var(--mono); font-size:10px; font-weight:700; }
  .pin:hover .dot{ transform:scale(1.12); }
  .city{ position:absolute; transform:translate(-50%,-50%); z-index:2; pointer-events:none; }
  .city .cd{ width:5px; height:5px; background:#fff; opacity:.55; border-radius:50%; margin:0 auto; }
  .city .cn{ font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:#fff; opacity:.42; margin-top:3px; font-weight:600; }
  .stlabel{ position:absolute; transform:translate(-50%,-50%); font-family:var(--serif);
    font-size:32px; letter-spacing:.26em; color:#fff; opacity:.3; text-transform:uppercase; z-index:1; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.4); }
  .water{ position:absolute; transform:translate(-50%,-50%); z-index:2; pointer-events:none;
    width:30px; height:20px; background:#274a63; opacity:.75; box-shadow:0 2px 8px rgba(0,0,0,.3); }

  /* ============ shared squared panel ============ */
  .panel{
    position:absolute; z-index:5; background:var(--panel);
    -webkit-backdrop-filter:blur(18px) saturate(1.4); backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,.6); box-shadow:0 18px 50px rgba(8,20,45,.28);
  }

  /* wordmark top-left */
  .brand{ top:22px; left:24px; padding:14px 18px 15px; }
  .brand .mark{ font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--navy); font-weight:700; }
  .brand h1{ font-family:var(--serif); font-weight:600; font-size:30px; line-height:.98; margin:4px 0 8px; letter-spacing:-.01em; }
  .brand .status{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); letter-spacing:-.01em; }
  .brand .status b{ color:var(--good); font-weight:700; }

  /* layer rail */
  .rail{ top:22px; right:24px; display:flex; flex-direction:column; padding:6px; gap:4px; }
  .rail button{
    width:46px; height:46px; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    color:var(--ink-soft); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
  }
  .rail button svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.6; }
  .rail button.on{ background:var(--navy); color:#fff; }
  .rail .sep{ height:1px; background:var(--line); margin:3px 4px; }

  /* legend bottom-left */
  .legend{ left:24px; bottom:24px; padding:13px 16px; }
  .legend h4{ font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0 0 9px; font-weight:700; }
  .legend .row{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-soft); margin-bottom:5px; }
  .legend .row:last-child{ margin-bottom:0; }
  .legend .sw{ width:11px; height:11px; }

  /* day/time strip bottom-center */
  .strip{ left:50%; bottom:24px; transform:translateX(-50%); display:flex; padding:0; overflow:hidden; }
  .day{
    width:74px; padding:11px 0 12px; text-align:center; cursor:pointer; border-right:1px solid var(--line);
    background:transparent; transition:background .12s;
  }
  .day:last-child{ border-right:none; }
  .day:hover{ background:rgba(47,107,176,.07); }
  .day.on{ background:var(--navy); }
  .day .wd{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .day.on .wd{ color:rgba(255,255,255,.7); }
  .day .dn{ font-family:var(--mono); font-size:17px; font-weight:700; margin:2px 0 7px; }
  .day.on .dn{ color:#fff; }
  .day .bar{ width:24px; height:4px; margin:0 auto; background:var(--c); }

  /* ============ SPOT DETAIL PANEL (right) ============ */
  .spot{ top:22px; right:84px; width:340px; padding:0; display:flex; flex-direction:column; }
  .spot .hd{ padding:20px 22px 16px; border-bottom:1px solid var(--line); }
  .spot .eyebrow{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; display:flex; gap:8px; align-items:center; }
  .spot .flag{ background:var(--navy-soft,#e7eefb); color:var(--navy); padding:2px 6px; font-size:8.5px; letter-spacing:.12em; }
  .spot .name{ font-family:var(--serif); font-size:30px; font-weight:600; line-height:1; margin:7px 0 3px; }
  .spot .region{ font-size:12px; color:var(--ink-soft); }
  .spot .verdict{ padding:18px 22px 16px; display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line); }
  .spot .vtag{ font-family:var(--serif); font-size:46px; font-weight:700; line-height:.85; letter-spacing:.01em; }
  .spot .vbig{ font-family:var(--mono); font-size:40px; font-weight:700; line-height:.85; margin-left:auto; }
  .spot .vbig small{ font-size:14px; color:var(--muted); font-weight:500; }
  .spot .window{ padding:14px 22px; font-size:12.5px; color:var(--ink-soft); border-bottom:1px solid var(--line); line-height:1.5; }
  .spot .window b{ color:var(--ink); font-family:var(--mono); font-weight:600; }
  .chart{ padding:16px 22px 14px; border-bottom:1px solid var(--line); }
  .chart .ct{ font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:11px; display:flex; justify-content:space-between; }
  .bars{ display:flex; align-items:flex-end; gap:3px; height:64px; position:relative; }
  .bars .thr{ position:absolute; left:0; right:0; border-top:1px dashed var(--navy-2); opacity:.5; }
  .bars .b{ flex:1; background:var(--light); position:relative; }
  .bars .b.pk{ background:var(--good); }
  .axis{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--muted); margin-top:6px; }
  .srcs{ padding:13px 22px; border-bottom:1px solid var(--line); }
  .srcs .ct{ font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:9px; }
  .srcs .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
  .srcs .s{ text-align:center; }
  .srcs .s .m{ font-family:var(--mono); font-size:14px; font-weight:700; }
  .srcs .s .l{ font-size:8.5px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-top:1px; }
  .srcs .s.off .m{ color:var(--muted); opacity:.5; }
  .chatter{ padding:15px 22px 18px; }
  .chatter .ct{ font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .quote{ border-left:2px solid var(--navy-2); padding:2px 0 2px 11px; font-size:12.5px; color:var(--ink); line-height:1.45; }
  .quote .src{ display:block; font-size:10.5px; color:var(--muted); margin-top:4px; font-family:var(--mono); }

  .note{ position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:9;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; color:#fff; opacity:.5; background:rgba(8,20,45,.4); padding:4px 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="note">DESIGN MOCKUP · satellite canvas is a placeholder · real Google satellite wires in on re-center</div>

  <!-- MAP -->
  <div class="map" id="map">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="plains" x1="0" y1="0.2" x2="1" y2="0.9">
          <stop offset="0"   stop-color="#9a9a63"/>
          <stop offset="0.5" stop-color="#b3a76d"/>
          <stop offset="1"   stop-color="#c9b87c"/>
        </linearGradient>
        <linearGradient id="mtn" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"    stop-color="#33402f"/>
          <stop offset="0.55" stop-color="#46583c"/>
          <stop offset="1"    stop-color="#46583c" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
          <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
          <stop offset="1"    stop-color="#000" stop-opacity="0.32"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>
      <!-- plains base -->
      <rect width="1440" height="900" fill="url(#plains)"/>
      <!-- mountains: west ~45% -->
      <rect width="660" height="900" fill="url(#mtn)"/>
      <!-- ridge relief -->
      <g filter="url(#soft)" fill="#2d3a29" fill-opacity="0.5">
        <path d="M0,120 L70,60 140,150 210,40 300,170 360,90 430,210 360,900 0,900 Z"/>
        <path d="M0,420 L90,360 170,470 250,380 340,520 280,900 0,900 Z" fill-opacity="0.45"/>
      </g>
      <g filter="url(#soft)" fill="#5d6e44" fill-opacity="0.4">
        <path d="M380,180 L460,120 540,240 600,160 660,300 600,900 380,900 Z"/>
      </g>
      <!-- South Platte + rivers for orientation -->
      <g stroke="#7d8a8f" stroke-opacity="0.4" stroke-width="2.5" fill="none">
        <path d="M470,360 q120,40 230,-10 t300,40 t380,-30"/>
        <path d="M520,470 q90,80 200,90 t260,30"/>
      </g>
      <!-- haze vignette -->
      <rect width="1440" height="900" fill="url(#vig)"/>
      <!-- state boundary lines -->
      <g stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 7" fill="none">
        <line x1="0" y1="180" x2="1440" y2="180"/>     <!-- WY/CO border lat 41 -->
        <line x1="1188" y1="180" x2="1188" y2="900"/>  <!-- CO/NE border lon ~-102.05 -->
      </g>
    </svg>
    <!-- state labels -->
    <div class="stlabel" style="left:62%; top:9%;">Wyoming</div>
    <div class="stlabel" style="left:55%; top:62%;">Colorado</div>
    <div class="stlabel" style="left:91%; top:55%;">Nebraska</div>
    <!-- cities + pins injected here -->
  </div>

  <!-- WORDMARK -->
  <div class="panel brand">
    <div class="mark">Kite Wind Watch</div>
    <h1>The map.</h1>
    <div class="status"><b>●</b> 7 spots live · 1 nuking · updated 2:47pm</div>
  </div>

  <!-- LAYER RAIL -->
  <div class="panel rail">
    <button class="on"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 14h15a3 3 0 1 1-3 3"/><path d="M3 11h8"/></svg>Wind</button>
    <button><svg viewBox="0 0 24 24"><path d="M4 7h9a2.5 2.5 0 1 0-2.5-2.5"/><path d="M4 12h14"/><path d="M4 17h11a2.5 2.5 0 1 1-2.5 2.5"/></svg>Gust</button>
    <button><svg viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 1 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>Temp</button>
    <div class="sep"></div>
    <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Find</button>
  </div>

  <!-- LEGEND -->
  <div class="panel legend">
    <h4>How good, right now</h4>
    <div class="row"><span class="sw" style="background:var(--nuke)"></span> Nuking · 33+ kt</div>
    <div class="row"><span class="sw" style="background:var(--strong)"></span> Strong · 25–32</div>
    <div class="row"><span class="sw" style="background:var(--good)"></span> Go · 18–24</div>
    <div class="row"><span class="sw" style="background:var(--marg)"></span> Marginal · 13–17</div>
    <div class="row"><span class="sw" style="background:var(--light)"></span> Too light · under 13</div>
  </div>

  <!-- DAY STRIP -->
  <div class="panel strip" id="strip"></div>

  <!-- SPOT DETAIL -->
  <div class="panel spot" id="spot"></div>
</div>

<script>
const TH = 15; // rideable threshold kt
// real spots + real coords; week[] = mock peak kt per day for the design mockup
const SPOTS = [
  {name:"Aurora Reservoir", region:"Denver Front Range", lat:39.61,  lon:-104.66,  week:[14,12,10,17,21,15,11]},
  {name:"Cherry Creek",     region:"Denver Front Range", lat:39.638, lon:-104.85,  week:[9,11,8,14,16,12,9]},
  {name:"Chatfield",        region:"Denver Front Range", lat:39.5475,lon:-105.0669,week:[11,10,9,15,18,13,10]},
  {name:"Union Reservoir",  region:"Longmont · Front Range",lat:40.1797,lon:-105.0383,week:[15,13,11,18,22,16,12]},
  {name:"Boyd Lake",        region:"Loveland · Front Range",lat:40.4402,lon:-105.0362,week:[16,14,11,19,23,17,13]},
  {name:"Lake Dillon",      region:"Colorado mountains", lat:39.6173,lon:-106.0558,week:[10,12,9,13,16,11,8]},
  {name:"Pueblo Reservoir", region:"Southern Colorado",  lat:38.2674,lon:-104.7382,week:[19,15,12,21,24,18,14]},
  {name:"Lake McConaughy",  region:"Nebraska high plains · driveable",lat:41.245,lon:-101.808,week:[26,20,15,28,34,22,17]},
  {name:"Lake Hattie",      region:"Wyoming · Laramie", flag:"Dad's tip", lat:41.2435,lon:-105.9285,week:[24,16,11,19,27,15,10], chatter:{q:"Hattie was solid all afternoon, windy but gusty as usual. Worth the drive when it lines up.", src:"r/Kiteboarding · 2d ago"}},
  {name:"Twin Buttes",      region:"Wyoming · Laramie", flag:"Dad's tip", lat:41.2387,lon:-105.8622,week:[20,15,10,17,24,14,9]},
  {name:"Williams Fork",    region:"Colorado · Grand County", flag:"Dad's tip", lat:40.0178,lon:-106.2116,week:[12,11,8,14,17,12,9]},
];
const CITIES=[
  {n:"Denver",lat:39.74,lon:-104.99},{n:"Fort Collins",lat:40.59,lon:-105.08},
  {n:"Laramie",lat:41.31,lon:-105.59},{n:"Cheyenne",lat:41.14,lon:-104.82},
  {n:"Pueblo",lat:38.62,lon:-104.61},
];
// projection over view bbox
const W={lon0:-107.0,lon1:-101.0,lat0:37.8,lat1:41.8};
const px=lon=>((lon-W.lon0)/(W.lon1-W.lon0))*100;
const py=lat=>((W.lat1-lat)/(W.lat1-W.lat0))*100;
const tier=k=> k>=33?{c:'var(--nuke)',t:'NUKING'}: k>=25?{c:'var(--strong)',t:'STRONG'}: k>=18?{c:'var(--good)',t:'GO'}: k>=13?{c:'var(--marg)',t:'MARGINAL'}:{c:'var(--light)',t:'TOO LIGHT'};
const DAYS=["Wed","Thu","Fri","Sat","Sun","Mon","Tue"];
const DNUM=[17,18,19,20,21,22,23];
let day=0, sel=8; // default day Wed, selected Lake Hattie

const map=document.getElementById('map');
// cities
CITIES.forEach(c=>{
  const d=document.createElement('div'); d.className='city';
  d.style.left=px(c.lon)+'%'; d.style.top=py(c.lat)+'%';
  d.innerHTML=`<div class="cd"></div><div class="cn">${c.n}</div>`;
  map.appendChild(d);
});
// water bodies under each spot
SPOTS.forEach(s=>{
  const w=document.createElement('div'); w.className='water';
  w.style.left=px(s.lon)+'%'; w.style.top=py(s.lat)+'%';
  map.appendChild(w);
});
// pins
const pinEls=SPOTS.map((s,i)=>{
  const el=document.createElement('div'); el.className='pin'; el.dataset.i=i;
  el.style.left=px(s.lon)+'%'; el.style.top=py(s.lat)+'%';
  el.innerHTML=`<div class="dot"></div><div class="lbl">${s.name}<br><span class="kt"></span></div>`;
  el.onclick=()=>{sel=i; render();};
  map.appendChild(el); return el;
});

function render(){
  // pins recolor by selected day's wind
  pinEls.forEach((el,i)=>{
    const k=SPOTS[i].week[day]; const tr=tier(k);
    el.style.setProperty('--c',tr.c);
    el.querySelector('.kt').textContent=k+' kt';
    el.classList.toggle('sel', i===sel);
    el.style.zIndex = i===sel? 6:3;
  });
  // day strip (colored by selected spot's day)
  document.getElementById('strip').innerHTML=DAYS.map((wd,d)=>{
    const k=SPOTS[sel].week[d]; const tr=tier(k);
    return `<div class="day ${d===day?'on':''}" data-d="${d}" style="--c:${tr.c}">
      <div class="wd">${wd}</div><div class="dn">${DNUM[d]}</div><div class="bar"></div></div>`;
  }).join('');
  document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{day=+el.dataset.d; render();});
  // spot panel
  const s=SPOTS[sel], k=s.week[day], tr=tier(k);
  const bars=[8,10,13,16,19,22,24,23,21,18,15,12,10,9].map((v,j)=>{
    const pk = j>=4&&j<=8; const h=Math.min(100,(v/30)*100);
    return `<div class="b ${pk?'pk':''}" style="height:${h}%"></div>`;
  }).join('');
  document.getElementById('spot').innerHTML=`
    <div class="hd">
      <div class="eyebrow">Selected${s.flag?` <span class="flag">${s.flag}</span>`:''}</div>
      <div class="name">${s.name}</div>
      <div class="region">${s.region}</div>
    </div>
    <div class="verdict">
      <div class="vtag" style="color:${tr.c}">${tr.t}</div>
      <div class="vbig">${k}<small> kt</small></div>
    </div>
    <div class="window">Best window <b>1–5pm</b> · <b>WNW</b> · holds <b>19–26</b> · gusts <b>31</b>. Rideable 6 of 9 daylight hours.</div>
    <div class="chart">
      <div class="ct"><span>Hourly · consensus of 7 models</span><span>kt</span></div>
      <div class="bars"><div class="thr" style="bottom:${(TH/30)*100}%"></div>${bars}</div>
      <div class="axis"><span>6a</span><span>10a</span><span>1p</span><span>4p</span><span>7p</span></div>
    </div>
    <div class="srcs">
      <div class="ct">Sources · ${DAYS[day]} ${DNUM[day]}</div>
      <div class="grid">
        <div class="s"><div class="m">23</div><div class="l">HRRR</div></div>
        <div class="s"><div class="m">25</div><div class="l">Best</div></div>
        <div class="s"><div class="m">22</div><div class="l">ECMWF</div></div>
        <div class="s off"><div class="m">—</div><div class="l">Wguru</div></div>
      </div>
    </div>
    <div class="chatter">
      <div class="ct">What people say</div>
      ${s.chatter?`<div class="quote">${s.chatter.q}<span class="src">${s.chatter.src}</span></div>`
        :`<div class="quote" style="border-color:var(--line); color:var(--muted)">No recent chatter for this spot.<span class="src">Reddit · checked today</span></div>`}
    </div>`;
}
render();
</script>
</body>
</html>
